<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dictaphone Rétro & Dictée Vocale</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #1a1612;
            color: #dcd3c1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .phone-body {
            background: linear-gradient(145deg, #2b241d, #1c1712);
            border: 4px solid #b8860b;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
            width: 100%;
            max-width: 420px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .phone-header {
            text-align: center;
            border-bottom: 2px solid #8b6508;
            padding-bottom: 8px;
        }

        .phone-header h1 {
            font-size: 1.1rem;
            color: #daa520;
            text-shadow: 1px 1px 2px #000;
            letter-spacing: 1px;
        }

        .retro-display {
            background-color: #0b1a0e;
            border: 3px inset #554116;
            border-radius: 10px;
            padding: 12px;
            box-shadow: inset 0 0 12px rgba(0,255,65,0.2);
            color: #33ff33;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #88cc88;
            border-bottom: 1px dashed #225522;
            padding-bottom: 4px;
        }

        .timer-display {
            font-size: 1.8rem;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #33ff33;
            margin: 4px 0;
        }

        .text-output {
            background-color: #fdf6e3;
            color: #2b241d;
            border: 2px solid #8b6508;
            border-radius: 8px;
            padding: 10px;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            height: 130px;
            width: 100%;
            resize: none;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            user-select: text;
            -webkit-user-select: text;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-retro {
            background: linear-gradient(145deg, #8b0000, #5c0000);
            color: #fff;
            border: 2px solid #daa520;
            border-radius: 12px;
            padding: 12px 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #3a0000, 0 5px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.1s ease;
        }

        .btn-retro:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #3a0000;
        }

        .btn-rec { background: linear-gradient(145deg, #b22222, #800000); }
        .btn-stop { background: linear-gradient(145deg, #444, #222); border-color: #aaa; box-shadow: 0 4px 0 #111; }
        .btn-save { background: linear-gradient(145deg, #2e8b57, #006400); border-color: #3cb371; box-shadow: 0 4px 0 #003300; }

        .recordings-list {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .recording-item {
            background: #2b241d;
            border: 1px solid #8b6508;
            border-radius: 6px;
            padding: 8px;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .recording-item audio {
            width: 100%;
            height: 30px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="phone-body">
        <div class="phone-header">
            <h1>🎙️ DICTAPHONE VINTAGE</h1>
        </div>

        <div class="retro-display">
            <div class="status-bar">
                <span id="status-text">PRÊT</span>
                <span id="rec-indicator">● RECT</span>
            </div>
            <div class="timer-display" id="timer">00:00</div>
        </div>

        <textarea id="transcript" class="text-output" placeholder="La dictée vocale s'affichera ici en direct pendant que vous parlez..."></textarea>

        <div class="controls">
            <button class="btn-retro btn-rec" id="btn-start" onclick="startAll()">
                <span>🔴</span>
                <span>DICTER</span>
            </button>
            <button class="btn-retro btn-stop" id="btn-stop" onclick="stopAll()" disabled>
                <span>⏹️</span>
                <span>ARRÊTER</span>
            </button>
            <button class="btn-retro btn-save" onclick="clearText()">
                <span>🧹</span>
                <span>EFFACER</span>
            </button>
        </div>

        <div style="font-size: 0.8rem; color: #daa520; margin-top: 5px;">📜 ENREGISTREMENTS :</div>
        <div class="recordings-list" id="recordings-list"></div>
    </div>

    <script>
        let mediaRecorder = null;
        let audioChunks = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let recognition = null;
        let isRecording = false;
        let finalTranscript = '';

        const timerDisplay = document.getElementById('timer');
        const statusText = document.getElementById('status-text');
        const transcriptArea = document.getElementById('transcript');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const recordingsList = document.getElementById('recordings-list');

        // Initialisation reconnaissance vocale
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                transcriptArea.value = finalTranscript + interimTranscript;
                transcriptArea.scrollTop = transcriptArea.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.warn('Erreur reconnaissance vocale:', event.error);
            };

            recognition.onend = () => {
                // Relance automatique si l'utilisateur n'a pas appuyé sur ARRÊTER
                if (isRecording) {
                    try { recognition.start(); } catch(e){}
                }
            };
        } else {
            alert("Votre navigateur ne supporte pas la reconnaissance vocale Web Speech API.");
        }

        function startTimer() {
            secondsElapsed = 0;
            timerDisplay.textContent = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        async function startAll() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    addRecordingToList(audioUrl);
                };

                mediaRecorder.start();
                isRecording = true;

                if (recognition) {
                    finalTranscript = transcriptArea.value ? transcriptArea.value + ' ' : '';
                    try { recognition.start(); } catch(e){}
                }

                startTimer();
                statusText.textContent = "ENREGISTREMENT...";
                statusText.style.color = "#ff3333";
                btnStart.disabled = true;
                btnStop.disabled = false;

            } catch (err) {
                alert("Erreur micro : " + err.message);
            }
        }

        function stopAll() {
            isRecording = false;

            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
                if (mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());
                }
            }

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            stopTimer();
            statusText.textContent = "PRÊT";
            statusText.style.color = "#88cc88";
            btnStart.disabled = false;
            btnStop.disabled = true;
        }

        function addRecordingToList(url) {
            const timeStr = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const item = document.createElement('div');
            item.className = 'recording-item';
            item.innerHTML = `
                <div><b>Note Audio</b> - ${timeStr} (${timerDisplay.textContent})</div>
                <audio controls src="${url}"></audio>
            `;
            recordingsList.prepend(item);
        }

        function clearText() {
            finalTranscript = '';
            transcriptArea.value = '';
        }
    </script>
</body>
</html>
